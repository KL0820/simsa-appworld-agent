name: Core contracts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runner
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra runtime
      - name: Test without credentials or AppWorld data
        run: >-
          uv run --no-sync pytest -q
          tests/test_completion_gate.py
          tests/test_variable_store.py
          tests/test_scenario_goal_completion.py
